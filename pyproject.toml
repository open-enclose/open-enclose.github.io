[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enclose"
version = "0.1.0"
description = "Model code for 'A Model of Enclosures' (Baker and Conning)"
authors = [
    { name = "Mathew J. Baker" },
    { name = "Jonathan Conning" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "sympy",     # enclose.symbolic -- the derivations the numeric layer is checked against
    "scipy",     # enclose.manufacturing -- the 3-sector equilibrium has no closed form
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["enclose*"]
